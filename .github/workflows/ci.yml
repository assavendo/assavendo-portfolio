name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    env: { NEXT_PUBLIC_SITE_URL: "https://example.com" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run check
      - name: Audit des dépendances (informatif, non bloquant)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Aucune adresse localhost dans les pages générées
        run: "! grep -rIl 'localhost:3000' .next/server/app --include='*.html' --include='*.xml' --include='*.txt' --include='*.rsc'"

  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Migrations, seed, RLS, concurrence et retours arrière sur PostgreSQL jetable
        run: PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) bash scripts/test-db.sh

  e2e:
    needs: verify
    runs-on: ubuntu-24.04
    env: { NEXT_PUBLIC_SITE_URL: "https://example.com" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: playwright-report, path: test-results }
